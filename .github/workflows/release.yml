name: Release

# Validates on every push to main. Publishing is DISABLED for now (see the
# commented-out `publish` job below) until the npm package name is finalized
# and configured as a Trusted Publisher on npmjs.com. Re-enable by uncommenting
# that job.
#
# When re-enabled: uses npm Trusted Publishing (OIDC) -- no NPM_TOKEN secret
# needed. The publish job explicitly compares the package.json `version` against
# what is on npm and only publishes when they differ, so an unbumped push to
# main is a clean no-op. Bump `version` in package.json to cut a release.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# id-token: write is NOT granted at the workflow level. When the `publish` job
# is re-enabled it must scope id-token to itself, so the long validation step
# (which runs many actions and scripts) never holds the OIDC publishing
# capability.
permissions:
  contents: read

jobs:
  # Re-run the full validation gate on the merge commit before doing anything
  # release-related. Branch protection covers the PR's HEAD, but flaky tests,
  # dep drift, or admin merges can let a broken commit land on main. Anything
  # publish-worthy must pass these checks first. This job has no id-token.
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fdbc4fdcf7d143a5d0a39e9a02e103b13e309024 # v6.0.4

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  # Publishing is DISABLED until the npm package name is finalized and
  # registered as a Trusted Publisher on npmjs.com. To re-enable, uncomment this
  # job. Only this job holds id-token: write, and it runs only after validate
  # succeeds.
  #
  # The release is gated on an explicit version-delta check: the `version` in
  # package.json is compared against what is currently published on npm, and the
  # publish steps run only when they differ. Cutting a release is therefore a
  # deliberate act — bump `version` in package.json and merge to main; an
  # unbumped push is a clean no-op, not a failed publish. Read the package name
  # from package.json so this keeps working after the placeholder name is set.
  #
  # publish:
  #   needs: validate
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #     id-token: write # required for npm OIDC trusted publishing + provenance
  #
  #   steps:
  #     - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
  #       with:
  #         fetch-depth: 0
  #
  #     # Compare local package.json version against the published one. Skip when
  #     # equal so re-running on a no-op commit neither errors nor republishes.
  #     - name: Resolve version delta
  #       id: ver
  #       run: |
  #         set -eo pipefail
  #         NAME=$(node -p "require('./package.json').name")
  #         LOCAL=$(node -p "require('./package.json').version")
