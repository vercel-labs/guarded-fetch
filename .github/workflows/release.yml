# On every push to main: re-validate the merge commit; then, if package.json's
# version differs from npm, publish with provenance and cut a GitHub Release.
#
# Uses npm Trusted Publishing (OIDC) -- no NPM_TOKEN secret needed. Requires the
# package to be configured as a Trusted Publisher on npmjs.com linked to this
# repo and this workflow filename, with Environment set to `release` (or left
# blank) and direct `npm publish` allowed. New Trusted Publishers default to
# stage-only; tick "allow npm publish" when registering.
#
# The publish job explicitly compares the package.json `version` against what
# is on npm and only publishes when they differ, so an unbumped push to main is
# a clean no-op. Bump `version` in package.json to cut a release.
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# id-token: write is NOT granted at the workflow level. It is scoped only to the
# `publish` job below, so the long validation step (which runs many actions and
# scripts) never holds the OIDC publishing capability. Likewise contents: write
# is scoped only to the `release` job, which holds no id-token and runs no code.
permissions:
  contents: read

jobs:
  # Re-run the full validation gate on the merge commit before doing anything
  # release-related. Branch protection covers the PR's HEAD, but flaky tests,
  # dep drift, or admin merges can let a broken commit land on main. Anything
  # publish-worthy must pass these checks first. This job has no id-token.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@fdbc4fdcf7d143a5d0a39e9a02e103b13e309024 # v6.0.4

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  # Only this job holds id-token: write, and it runs only after validate
  # succeeds. It holds no write access to the repo.
  #
  # The release is gated on an explicit version-delta check: the `version` in
  # package.json is compared against what is currently published on npm, and the
  # publish steps run only when they differ. Cutting a release is therefore a
  # deliberate act -- bump `version` in package.json and merge to main; an
  # unbumped push is a clean no-op, not a failed publish.
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publishing + provenance
    outputs:
      published: ${{ steps.ver.outputs.publish }}
      version: ${{ steps.ver.outputs.version }}

    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      # Compare local package.json version against the published one. Skip when
      # equal so re-running on a no-op commit neither errors nor republishes.
      - name: Resolve version delta
        id: ver
        run: |
          set -eo pipefail
          NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$NAME" version 2>/dev/null || true)
          echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" != "$PUBLISHED" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Will publish $NAME@$LOCAL (currently on npm: ${PUBLISHED:-<none>})"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$LOCAL already on npm -- skipping publish"
          fi

      # Everything below runs only when there is a new version to ship.
      - if: steps.ver.outputs.publish == 'true'
        uses: pnpm/action-setup@fdbc4fdcf7d143a5d0a39e9a02e103b13e309024 # v6.0.4

      - if: steps.ver.outputs.publish == 'true'
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - if: steps.ver.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      # npm publish runs prepublishOnly (pnpm build), rebuilding from a clean
      # checkout. npm performs the OIDC exchange; --provenance attaches a signed
      # attestation linking the tarball to this workflow run + commit (requires
      # a PUBLIC repo and id-token: write).
      - if: steps.ver.outputs.publish == 'true'
        run: npm publish --provenance

  # Tag the published commit and create a GitHub Release with notes
  # auto-generated from PR titles merged since the previous tag. Runs only
  # after npm publish succeeded, so a GH Release only ever exists for a version
  # that actually made it to the registry. This job holds contents: write but
  # no id-token, and does not check out or run any repo code.
  release:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the git tag + GitHub Release

    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -eo pipefail
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --generate-notes
